name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Test and validate binder data
        env:
          DIGITAL_BINDER_PREVIOUS_REF: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            DIGITAL_BINDER_PREVIOUS_REF="$(git rev-parse HEAD^)"
            export DIGITAL_BINDER_PREVIOUS_REF
          fi
          python -m pytest scripts/test_check_registry.py scripts/test_digital_binder.py scripts/test_holding_binder.py scripts/test_holding_preview.py -q
          node --test scripts/test_binder_js_behavior.mjs
          python scripts/check-registry.py docs/card-registry.md
          python scripts/check-digital-binder.py --check
          python scripts/holding_binder.py --check

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build draft binder with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --buildDrafts \
            --gc \
            --minify \
            --destination draft-public \
            --baseURL "https://collection.dpao.la/"

      - name: Validate rendered draft binder output
        run: python scripts/check-digital-binder.py --check-public draft-public

      - name: Build production with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://collection.dpao.la/"

      - name: Validate rendered production binder output
        run: python scripts/check-digital-binder.py --check-public public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
