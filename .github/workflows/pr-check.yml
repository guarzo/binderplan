name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Install Hugo
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v0.154.5/hugo_extended_0.154.5_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test and validate
        run: |
          python -m pytest scripts -q
          node --test scripts/test_binder_js_behavior.mjs
          node scripts/test_slab_js_behavior.mjs
          python scripts/check-registry.py docs/card-registry.md
          python scripts/check-digital-binder.py --check
          python scripts/check-gallery.py
          python scripts/make-slab-previews.py --check
          python scripts/holding_binder.py --check
      - name: Build and validate site
        run: |
          hugo --gc --minify --baseURL https://collection.dpao.la/ --destination /tmp/binderplan-pr-public
          python scripts/check-digital-binder.py --check-public /tmp/binderplan-pr-public
