<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary:    #12131a;
  --bg-secondary:  #1c1e2a;
  --bg-tertiary:   #272a3a;
  --text-primary:  #e8e6f0;
  --text-muted:    #9a96b0;
  --accent:        #6c9bff;
  --accent-hover:  #8fb4ff;
  --accent-warm:   #f0a050;
  --accent-green:  #5ec49e;
  --accent-rose:   #e87ca0;
  --border:        #333548;
  --max-width: 1200px;
  --content-width: 800px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.7;
  min-height: 100vh;
}

a {
  color: var(--accent);
  text-decoration: none;
  transition: color 0.2s;
}

a:hover {
  color: var(--accent-hover);
}

h1, h2 {
  font-family: 'DM Serif Display', serif;
  font-weight: 400;
  line-height: 1.3;
  margin-bottom: 0.75em;
}

h3, h4 {
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 0.75em;
}

h1 { font-size: 2.25rem; }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.35rem; }

p {
  margin-bottom: 1.25em;
}

ul, ol {
  margin-bottom: 1.25em;
  padding-left: 1.5em;
}

li {
  margin-bottom: 0.5em;
}

blockquote {
  border-left: 3px solid var(--accent-warm);
  padding-left: 1.25em;
  margin: 1.5em 0;
  color: var(--text-muted);
  font-style: italic;
}

code {
  background: var(--bg-tertiary);
  padding: 0.2em 0.4em;
  border-radius: 4px;
  font-size: 0.9em;
}

pre {
  background: var(--bg-secondary);
  padding: 1.25em;
  border-radius: 8px;
  overflow-x: auto;
  margin-bottom: 1.5em;
}

pre code {
  background: none;
  padding: 0;
}

hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2.5em 0;
}

/* Header & Navigation */
.site-header {
  position: sticky;
  top: 0;
  background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.site-title {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--text-primary);
}

.site-title:hover {
  color: var(--accent);
}

.site-nav ul {
  display: flex;
  gap: 2rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.site-nav a {
  color: var(--text-muted);
  font-weight: 500;
  font-size: 0.95rem;
  padding-bottom: 4px;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}

.site-nav a:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.site-nav a.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Main Content */
.content {
  max-width: var(--content-width);
  margin: 0 auto;
  padding: 3rem 2rem;
}

/* Single Page */
.single-header {
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}

.single-header .description {
  color: var(--text-muted);
  font-size: 1.1rem;
  margin-bottom: 0;
}

/* List Page */
.list-header {
  margin-bottom: 2.5rem;
}

.list-content {
  margin-bottom: 3rem;
}

.list-items {
  list-style: none;
  padding: 0;
}

.list-item {
  margin-bottom: 1rem;
}

.list-item a {
  display: block;
  padding: 1.25rem;
  background: var(--bg-secondary);
  border-radius: 8px;
  border: 1px solid var(--border);
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}

.list-item a:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(108, 155, 255, 0.15);
}

.list-item h2 {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.25rem;
  color: var(--text-primary);
}

.list-item p {
  color: var(--text-muted);
  margin-bottom: 0;
  font-size: 0.95rem;
}

/* Gallery */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
  margin-top: 2rem;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  cursor: pointer;
  animation: fadeInUp 0.5s ease both;
}

.gallery-item:nth-child(2) { animation-delay: 0.05s; }
.gallery-item:nth-child(3) { animation-delay: 0.1s; }
.gallery-item:nth-child(4) { animation-delay: 0.15s; }
.gallery-item:nth-child(5) { animation-delay: 0.2s; }
.gallery-item:nth-child(6) { animation-delay: 0.25s; }

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.3s;
}

.gallery-item:hover img {
  transform: scale(1.05);
}

.gallery-item figcaption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 1rem;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  color: var(--text-primary);
  font-size: 0.9rem;
}

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.95);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 1rem;
  right: 1.5rem;
  color: var(--text-primary);
  font-size: 2rem;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s;
}

.lightbox-close:hover {
  opacity: 1;
}

/* Footer */
.site-footer {
  border-top: 1px solid var(--border);
  padding: 2rem;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* Hero intro (home page) */
.hero-intro {
  text-align: center;
  max-width: 640px;
  margin: 0 auto 3rem;
}

.hero-intro h1 {
  font-size: 2.75rem;
  margin-bottom: 0.5em;
}

.hero-intro .tagline {
  font-size: 1.15rem;
  color: var(--text-muted);
  margin-bottom: 1.5em;
}

.explore-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.25rem;
  margin-top: 2rem;
}

.explore-card {
  display: block;
  padding: 1.5rem;
  background: var(--bg-secondary);
  border-radius: 8px;
  border: 1px solid var(--border);
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  text-align: left;
}

.explore-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(108, 155, 255, 0.15);
}

.explore-card:nth-child(1) { border-top: 3px solid var(--accent); }
.explore-card:nth-child(2) { border-top: 3px solid var(--accent-warm); }
.explore-card:nth-child(3) { border-top: 3px solid var(--accent-green); }
.explore-card:nth-child(4) { border-top: 3px solid var(--accent-rose); }

.explore-card h3 {
  color: var(--text-primary);
  margin-bottom: 0.35rem;
}

.explore-card p {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 0;
}

/* Responsive */
@media (max-width: 768px) {
  .header-inner {
    flex-direction: column;
    gap: 1rem;
  }

  .site-nav ul {
    gap: 1.25rem;
  }

  h1 { font-size: 1.75rem; }
  h2 { font-size: 1.35rem; }

  .hero-intro h1 {
    font-size: 2rem;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
  }

  .explore-cards {
    grid-template-columns: 1fr;
  }
}

/* Theme cards (for philosophy section) */
.theme-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.theme-card:nth-child(4n+1) h3 { color: var(--accent); }
.theme-card:nth-child(4n+2) h3 { color: var(--accent-warm); }
.theme-card:nth-child(4n+3) h3 { color: var(--accent-green); }
.theme-card:nth-child(4n+4) h3 { color: var(--accent-rose); }

.theme-card .signal {
  color: var(--text-muted);
  font-style: italic;
  font-size: 0.95rem;
}

/* Gallery page content */
.gallery-content {
  max-width: var(--max-width);
}
</style>
