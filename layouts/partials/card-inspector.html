{{ $titleID := printf "card-inspector-title-%s" .id }}
<dialog class="card-inspector" data-card-inspector aria-labelledby="{{ $titleID }}">
  <div class="card-inspector-controls">
    <button type="button" data-card-inspector-close>Close</button>
    <button type="button" data-card-inspector-previous>Previous card</button>
    <button type="button" data-card-inspector-next>Next card</button>
  </div>
  <img data-card-inspector-image alt="" hidden>
  <div class="card-inspector-copy">
    <h2 id="{{ $titleID }}" data-card-inspector-name></h2>
    <dl>
      <div><dt>Language</dt><dd data-card-inspector-field="language"></dd></div>
      <div><dt>Set / number</dt><dd data-card-inspector-field="set-number"></dd></div>
      <div><dt>Binder location</dt><dd data-card-inspector-field="theme-pocket"></dd></div>
      <div><dt>Image fidelity</dt><dd data-card-inspector-field="image-classification"></dd></div>
      <div><dt>Image source</dt><dd data-card-inspector-field="image-source"></dd></div>
      <div><dt>Image notes</dt><dd data-card-inspector-field="image-note"></dd></div>
      <div><dt>Placement</dt><dd data-card-inspector-field="placement"></dd></div>
    </dl>
  </div>
</dialog>
