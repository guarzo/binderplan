{{ define "main" }}
<article class="gallery-page">
  <header class="single-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="description">{{ . }}</p>{{ end }}
  </header>

  {{ if .Params.binder }}
    {{ partial "binder.html" . }}
  {{ else }}
    <div class="gallery-content">
      {{ .Content }}
    </div>
  {{ end }}
</article>
{{ end }}
